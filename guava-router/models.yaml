# Guava Stack model picks: the one place to change when better models come out.
#
# The head-chef (plans, researches, writes, reviews) runs through Claude Code on the
# owner's Claude plan, and the line-cook (does the bulk work) through Codex on their
# ChatGPT plan. An owner with only one of the two plans gets that company's next_best
# in the other slot, so both slots run on the one plan. An owner with neither plan gets
# the openrouter_only picks. Computer use is line-cook work.
#
# To swap in a newer model:
#   1. Change its name, id and effort below.
#   2. Run: python3 scripts/sync-models.py
#      It copies these picks into every README and skill that shows them.
#   3. Owners who are already set up say "check for newer models" to their assistant.
#
# Fields:
#   name:   what people see, such as "Claude Opus 5.5"
#   id:     the model ID the command-line tool takes
#   effort: thinking effort (low, medium, high, xhigh or max)
#   next_best: the slot's pick from the other company (name, id and effort), used
#              when the owner pays for only that company's plan

updated: 2026-10-24

head_chef:
  name: Claude Opus 5.5
  id: claude-opus-5-5
  effort: high
  next_best:
    name: GPT-6 Astra
    id: gpt-6-astra
    effort: high

line_cook:
  name: GPT-6.1 Sol
  id: gpt-6.1-sol
  effort: high
  next_best:
    name: Claude Sonnet 5.5
    id: claude-sonnet-5-5
    effort: high

# An owner with no Claude or ChatGPT plan runs both slots on OpenRouter, billed
# per use, through the Pi coding agent (pi), signed in to OpenRouter in the browser or with
# an OpenRouter API key. id here is the OpenRouter model ID; effort is OpenRouter's
# reasoning effort, which pi's --thinking sets.
openrouter_only:
  head_chef:
    name: Kimi K3.1 Pro
    id: moonshotai/kimi-k3.1-pro
    effort: high
  line_cook:
    name: DeepSeek V4.1 Flash 1017
    id: deepseek/deepseek-v4.1-flash-1017
    effort: high

# The oracle-council skill asks three models the same hard question at once, each at max
# effort, then the head-chef merges their answers. Each seat runs on the owner's plan
# through Claude Code or Codex where it can, and on OpenRouter otherwise:
#   chatgpt: Codex on a ChatGPT plan. OpenRouter with no ChatGPT plan, or when Codex fails.
#   claude:  Claude Code, with the max model on a Claude Max plan and the pro model on
#            Pro. OpenRouter only with no Claude plan, and never Fable there, since
#            it costs far more than Opus.
#   gemini:  Gemini 4 Argon on OpenRouter only, billed per use.
# openrouter fields are OpenRouter model IDs. sync-models.py copies this section into
# guava-hub/skills/oracle-council/members.json, which oracle-council.py reads.
oracle_council:
  chatgpt:
    name: GPT-6 Astra
    id: gpt-6-astra
    openrouter: openai/gpt-6-astra
    effort: max
  claude:
    max:
      name: Claude Fable 5.1
      id: claude-fable-5-1
    pro:
      name: Claude Opus 5.5
      id: claude-opus-5-5
    openrouter:
      name: Claude Opus 5.5
      id: anthropic/claude-opus-5.5
    effort: max
  gemini:
    name: Gemini 4 Argon
    openrouter: google/gemini-4-argon
    effort: max

# What each role does. Shown in the READMEs.
roles:
  head_chef: orchestration, research, planning, brainstorming, copywriting, validation, review, verification, fuzzy and hard problems
  line_cook: bulk execution, coding, computer use, sub-agent tasks, worker threads, long-running jobs
