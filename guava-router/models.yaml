# Guava Stack model picks: the one place to change when better models come out.
#
# Each setup names a head-chef (plans, researches, writes, reviews) and a line-cook
# (does the bulk work), based on which AI plans the owner pays for.
#
# To swap in a newer model:
#   1. Change its name, id and effort below.
#   2. Run: python3 scripts/sync-models.py
#      It copies these picks into every README and skill that shows them.
#   3. Owners who are already set up say "check for newer models" to their assistant.
#
# Fields:
#   name:   what people see, such as "Claude Opus 5.5"
#   id:     the model ID the command-line tool takes
#   effort: thinking effort (low, medium, high, xhigh or max where the tool supports it;
#           Antigravity CLI takes low, medium or high)
#   tool:   claude-code, codex or antigravity (the command-line tool that runs it)
#   app:    claude, chatgpt or gemini (the app where people pick this model in chat)

updated: 2026-10-16

setups:
  claude-chatgpt:
    label: Claude + ChatGPT
    pays_for: Claude and ChatGPT
    default: true
    head_chef:
