# What each role does. Shown under the head-chef and line-cook in the READMEs.
roles:
  head_chef: orchestration, research, planning, brainstorming, copywriting, validation, review, verification, fuzzy and hard problems
  line_cook: bulk execution, coding, sub-agent tasks, worker threads, long-running jobs
